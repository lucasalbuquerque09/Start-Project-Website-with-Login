<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <!-- cabeçalho -->
    <header class="cabecalho">
        <div class="interface-cabecalho">
            <h1>Logo</h1>
            <nav class="lista-menu">
                <ul>
                    <li><a href="#" title="Home">Home</a></li>
                    <li><a href="#" title="About">About</a></li>
                    <li><a href="#" title="Services">Services</a></li>
                    <li><a href="#" title="Contact">Contact</a></li>
                </ul>
                <button class="btn-menu" type="submit">Login</button>
            </nav>

        </div>
    </header>

    <!-- formulário de login -->
    <div class="main-form">
        
        <div class="interface-form">
            
            <i  id="close" class="bi bi-x-lg"></i>
            
            <h1>Login</h1>
            
            <form action="#" method="post" >
            
                <div class="container-form container-password">
                    <input class="group-form" type="text" name="email" id="email" placeholder="Email" required autocomplete="off">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="container-form ">
                    <input class="group-form " type="password" name="senha" id="senha" placeholder="Password" required autocomplete="off">
                    <i id="btn-senha" class="bi bi-eye-fill"></i>
                </div>
            
                <div class="remember-forgot">
                    <div class="remember">
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#">Forgot Password?</a>
                </div>
            
                <button class="btn-login" type="submit">Login</button>
            
                <p class="register">
                    Don't have an account? <a href="#">Register</a>
                </p>
            </form>
        </div>
    </div>
   <script src="script.js"></script>
</body>

</html>
