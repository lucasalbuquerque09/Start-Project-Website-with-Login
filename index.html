<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <!-- cabeçalho -->
    <header class="cabecalho">
            
        <h2>Logo</h2>
            
        <nav class="menu-desktop">
                
            <a href="#" title="Home">Home</a>
            <a href="#" title="About">About</a>
            <a href="#" title="Services">Services</a>
            <a href="#" title="Contact">Contact</a>
                
            <button class="btn-menu" type="submit">Login</button>
            
        </nav>
   
    </header>
    <!-- fim cabeçalho -->
    
    <!-- formulário de login -->
    <div class="main-form">
        
        <!-- ícone de fechar -->
        <span class="icon-close">
            <i  class="bi bi-x-lg"></i>
        </span>
        <!-- fim ícone de fechar -->
        
        <!-- formulário de login -->
        <div class="container-form login">
            <h1>Login</h1>
            
            <form action="#" method="post" autocomplete="off">
                
                <div class="group-input">
                    <input type="text" name="email" id="email"required autocomplete="off">
                    <label for="email">Email</label>
                    <i class="bi bi-envelope-fill"></i>
                </div>
            
                <div class="group-input">
                    <input type="password" name="senha" id="senha" required autocomplete="off">
                    <label for="senha">Password</label>
                    <i id="btn-senha-login" class="bi bi-eye-fill"></i>
                </div>
                
                <div class="remember-forgot">
                    <label><input type="checkbox" name="remember" id="remember"> Remember me</label>
                    
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button class="btn-login" type="submit">Login</button>
                
                <p class="register">
                    Don't have an account? <a class="register-link" href="#">Register</a>
                </p>
            </form>
        </div>
        <!-- fim formulário de login -->

        <!-- formulário de registro -->
        <div class="container-form register">
            
            <h1>Registration</h1>
            
            <form action="#" method="post" autocomplete="off">

                <div class="group-input">
                    <input type=" text" name="username" id="username"required autocomplete="off">
                    <label for="username">Username</label>
                    <i class="bi bi-person-fill"></i>
                </div>
                
                <div class="group-input">
                    <input type="email" name="email" id="email"required autocomplete=" off">
                    <label for="email">Email</label>
                    <i class="bi bi-envelope-fill"></i>
                </div>
            
                <div class="group-input">
                    <input type="password" name="senha" id="senha-register" required autocomplete="off">
                    <label for="senha-register">Password</label>
                    <i id="btn-senha-register" class="bi bi-eye-fill"></i>
                </div>
                
                <div class="remember-forgot">
                    <label><input type="checkbox" name="terms" id="terms"> I agree to the terms and conditions</label>
                </div>
                
                <button class="btn-login" type="submit">Register</button>
                
                <p class="register">
                    Already have an account? <a class="login-link" href="#">Login</a>
                </p>
            </form>
        
        </div>
        <!-- fim formulário de registro -->
    </div>
    
    <script src="script.js"></script>

</body>

</html>
